plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.moc.phoosar"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    defaultConfig {
        applicationId = "com.moc.updatephoosar"
        minSdk = 21
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libaosl.so'
        pickFirst 'lib/x86_64/libaosl.so'
        pickFirst 'lib/x86/libaosl.so'
        pickFirst 'lib/armeabi-v7a/libaosl.so'

        exclude 'lib/armeabi-v7a/libagora_ai_denoise_extension.so'
        exclude 'lib/armeabi-v7a/libagora_spatial_audio_extension.so'
        exclude 'lib/armeabi-v7a/libagora_full_audio_format_extension.so'

        exclude 'lib/arm64-v8a/libagora_ai_denoise_extension.so'
        exclude 'lib/arm64-v8a/libagora_spatial_audio_extension.so'
        exclude 'lib/arm64-v8a/libagora_full_audio_format_extension.so'
    }

    signingConfigs {
        release {
            storeFile file("../phoosar-keystore.jks")
            storePassword "com.moc.updatephoosar"
            keyAlias "com.moc.updatephoosar"
            keyPassword "com.moc.updatephoosar"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation 'com.google.android.gms:play-services-auth:20.4.1'
}

flutter {
    source = "../.."
}
